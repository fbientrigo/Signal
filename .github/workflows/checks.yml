name: checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-demo.txt
      - run: python -m unittest discover -s tests -v
      - run: MPLBACKEND=Agg python examples/categorical_comparison.py
      - run: MPLBACKEND=Agg python examples/trend_with_uncertainty.py
